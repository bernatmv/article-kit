name: Release

# A tag publishes the prebuilt package as a release asset. Consumers install that
# tarball rather than the git tag, so their install never builds article-kit: a
# git dependency's build step ran a nested pnpm install that, on Vercel, found the
# consumer's own workspace and installed it again, recursively.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="article-kit-${GITHUB_REF_NAME#v}.tgz"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$file" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$file" --verify-tag --generate-notes
